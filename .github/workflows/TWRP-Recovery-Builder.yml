name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: ''
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/kinguser981/cap_sprout_twrp'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/nokia/cap_sprout'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'cap_sprout'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true
jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v3
    - name: Download Stock Vendor Boot
      run: |
        curl -L -s --retry 5 --retry-delay 3 --connect-timeout 10 -o vendor_boot.img "https://gofile.io/d/RU3Ms5a7"
    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "::endgroup::"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
        
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 8

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1'  || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "Samuel Kendall"
        git config --global user.email "kinguser981@gmail.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
  
    - name: Repo Sync
      run: |
        cd workspace
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Build Makefile
      run: |
        cd workspace
        if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME}}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "No recovery makefile file found!"
        fi
      continue-on-error: true
      
    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1'  && github.event.inputs.MANIFEST_BRANCH != 'twrp-14'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    - name: Building Image 
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ env.DEVICE_MAKEFILE }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        echo "Done building your ${{ github.event.inputs.BUILD_TARGET }}.img"
      
    - name: Set Build Date # Output will be use in Release
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Include Recovery Installer
      run: |
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
          wget https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
          zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true
        
    - name: Recovery to tar for Samsung devices
      run: |
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
          tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true

    
    - name: Find vendor_boot.img
      shell: bash
      run: |
          set -euo pipefail

          echo "Searching for vendor_boot.img..."

          find . -type f -name "vendor_boot.img" -print

          FILE="$(find . -type f -name "vendor_boot.img" -print -quit)"

          if [ -z "$FILE" ]; then
            echo "::error::vendor_boot.img was not found."
            echo "Checking available boot images..."

            find . -type f \( \
              -name "boot.img" -o \
              -name "recovery.img" -o \
              -name "vendor_boot*.img" \
            \) -print | head -100

            exit 1
          fi

          echo "Found image: $FILE"
          ls -lh "$FILE"

          mkdir -p upload
          cp "$FILE" upload/vendor_boot.img

          echo "VENDOR_BOOT_FILE=upload/vendor_boot.img" >> "$GITHUB_ENV"

    
    - name: Create GitHub Release and Upload vendor_boot.img
      uses: softprops/action-gh-release@v2
      with:
          tag_name: TWRP-${{ github.run_id }}
          name: "Unofficial TWRP - Infinix Note 30 X6833B"
          body: |
            Unofficial TWRP Recovery for Infinix Note 30 (X6833B).

            - Android: 16
            - Build: GitHub Actions
            - Image: vendor_boot.img

            Проверь совместимость образа перед прошивкой.
          draft: false
          prerelease: false
          files: workspace/out/target/product/Infinix-X6833B/vendor_boot.img
          fail_on_unmatched_files: true
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Print Release URL
      shell: bash
      run: |
          echo "Release создан:"
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/TWRP-${GITHUB_RUN_ID}"

    - name: Upload vendor_boot.img to GoFile
      shell: bash
      env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
      run: |
          set -euo pipefail

          FILE="upload/vendor_boot.img"

          if [ ! -f "$FILE" ]; then
            echo "::error::vendor_boot.img not found: $FILE"
            exit 1
          fi

          echo "Uploading vendor_boot.img to GoFile..."
          ls -lh "$FILE"

          if [ -n "${GOFILE_TOKEN:-}" ]; then
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --retry 2 \
              -H "Authorization: Bearer ${GOFILE_TOKEN}" \
              -F "file=@${FILE}" \
              https://upload.gofile.io/uploadfile)
          else
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --retry 2 \
              -F "file=@${FILE}" \
              https://upload.gofile.io/uploadfile)
          fi

          echo "$RESPONSE" > gofile-response.json

          python3 - <<'PY'
          import json
          import os
          import sys

          with open("gofile-response.json", encoding="utf-8") as f:
              response = json.load(f)

          if response.get("status") != "ok":
              print("GoFile upload failed:", response)
              sys.exit(1)

          data = response.get("data", {})
          link = data.get("downloadPage") or data.get("downloadPageUrl")

          if not link:
              contents = data.get("contents", {})
              if isinstance(contents, dict):
                  for item in contents.values():
                      if isinstance(item, dict) and item.get("link"):
                          link = item["link"]
                          break

          if not link:
              print("Upload may have succeeded, but no download link was found.")
              print(json.dumps(response, indent=2))
              sys.exit(1)

          print("GoFile download page:", link)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("GOFILE_DOWNLOAD_URL=" + link + "\n")
          PY

    - name: Show GoFile link
      if: success()
      shell: bash
      run: |
          echo "GoFile link: ${GOFILE_DOWNLOAD_URL}"       
