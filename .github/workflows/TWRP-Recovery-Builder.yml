name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
       RUN_DIAGNOSTICS:
        description: 'Only diagnose source compatibility'
        required: true
        type: boolean
        default: true
       MANIFEST_BRANCH:
        description: TWRP branch
        required: true
        type: choice
        default: twrp-14.1
        options:
          - twrp-14.1
       DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/Sulustan007/twrp-device_infinix_Infinix-X6833B'
       DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'fox_12.1-a14'
       DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/infinix/Infinix-X6833B'
       DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'X6833B'
       BUILD_TARGET:
        description: Build target
        required: true
        type: choice
        default: vendorboot
        options:
            - vendorboot
       LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
       RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
       RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true
jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v3
   
    
    - name: Download Stock Vendor Boot
      if: ${{ !inputs.RUN_DIAGNOSTICS }}
      shell: bash
      run: |
        set -euo pipefail

        URL="https://drive.google.com/uc?export=download&id=178LNFOUClXJQpp499-dF_bMc4BDdmf10"

        echo "Downloading vendor_boot.img from Google Drive..."

        python3 -m pip install --user gdown

        "$(python3 -m site --user-base)/bin/gdown" \
          "$URL" \
          -O vendor_boot.img

        if [ ! -s vendor_boot.img ]; then
          echo "::error::Downloaded file is empty."
          exit 1
        fi

        SIZE=$(stat -c %s vendor_boot.img)
        echo "Downloaded size: $SIZE bytes"
        file vendor_boot.img

        if [ "$SIZE" -lt 1048576 ]; then
          echo "::error::File is too small or download failed."
          exit 1
        fi

        if head -c 500 vendor_boot.img | grep -Eqi '<!DOCTYPE html|<html'; then
          echo "::error::Google Drive returned HTML instead of the image."
          exit 1
        fi

        echo "SHA256:"
        sha256sum vendor_boot.img

        ls -lh vendor_boot.img
        echo "Download completed successfully."


   
    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "::endgroup::"

    - name: Cleanup
      if: ${{ !inputs.RUN_DIAGNOSTICS }}
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Set Swap Space
      if: ${{ !inputs.RUN_DIAGNOSTICS }}
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
        
    - name: Prepare the environment
      if: ${{ !inputs.RUN_DIAGNOSTICS }}
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install OpenJDK
      if: ${{ !inputs.RUN_DIAGNOSTICS }}
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 11

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1'  || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      shell: bash
      run: |
        set -e
        mkdir -p "$GITHUB_WORKSPACE/workspace"
        cd "$GITHUB_WORKSPACE/workspace"

        git config --global user.name "Samuel Kendall"
        git config --global user.email "kinguser981@gmail.com"

        repo init --depth=1 \
          -u "${{ steps.manifest.outputs.value }}" \
          -b "${{ github.event.inputs.MANIFEST_BRANCH }}"
          
    - name: Repo Sync
      shell: bash
      run: |
        set -e
        cd "$GITHUB_WORKSPACE/workspace"
        repo sync -c --no-clone-bundle --no-tags -j2 --force-sync

    - name: Clone Device Tree
      shell: bash
      run: |
        set -e
        cd "$GITHUB_WORKSPACE/workspace"

        git clone \
          --depth=1 \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          "${{ github.event.inputs.DEVICE_TREE }}" \
          "${{ github.event.inputs.DEVICE_PATH }}"

        cd "${{ github.event.inputs.DEVICE_PATH }}"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

        
    
    - name: Check GSI makefiles
      run: |
       echo "=== Current directory ==="
          pwd

          echo "=== Device trees ==="
          ls -la device/ || true
          find device -maxdepth 4 -type d \
            \( -name '*mt6789*' -o -name '*X6833B*' \) -print 2>/dev/null || true

          echo "=== Common tree directory ==="
          if [ -d device/transsion/mt6789-common ]; then
            git -C device/transsion/mt6789-common branch --show-current
          else
            echo "Common tree is missing"
          fi

          echo "=== GSI makefiles ==="
          find build/make/target/product -maxdepth 1 \
            \( -name '*gsi*keys*.mk' -o -name 'gsi_keys.mk' \) \
            -print 2>/dev/null || true

          echo "=== Clone commands in device tree ==="
          grep -n -E 'git clone|mt6789-common' \
            device/infinix/Infinix-X6833B/vendorsetup.sh 2>/dev/null || true


    - name: Check Build Makefile
      shell: bash
      run: |
        set -euo pipefail
        cd workspace

        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"
        DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}"

        echo "Checking device path: $DEVICE_PATH"
        ls -la "$DEVICE_PATH"

        if [ -f "$DEVICE_PATH/twrp_${DEVICE_NAME}.mk" ]; then
          echo "DEVICE_MAKEFILE=twrp_${DEVICE_NAME}" >> "$GITHUB_ENV"
        elif [ -f "$DEVICE_PATH/omni_${DEVICE_NAME}.mk" ]; then
          echo "DEVICE_MAKEFILE=omni_${DEVICE_NAME}" >> "$GITHUB_ENV"
        else
          echo "::error::Could not find a matching device makefile"
          echo "Available makefiles:"
          find "$DEVICE_PATH" -maxdepth 1 -type f -name "*.mk"
          exit 1
        fi

    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1' && github.event.inputs.MANIFEST_BRANCH != 'twrp-14.1'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    - name: Diagnose Android source tree
      shell: bash
      run: |
        set -eo pipefail
        cd "$GITHUB_WORKSPACE/workspace"

        echo "=== Workspace ==="
        pwd
        ls -la

        echo "=== Build system ==="
        ls -ld build build/make build/make/core 2>/dev/null || true

        echo "=== Loading build environment ==="
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true

        echo "=== Common device tree ==="
        if [ -f device/transsion/mt6789-common/common.mk ]; then
          sed -n '1,80p' device/transsion/mt6789-common/common.mk
        else
          echo "common.mk not found at expected path"
          find device -maxdepth 5 -type f -name common.mk 2>/dev/null || true
        fi

        echo "=== GSI key references ==="
        grep -R -n 'gsi_keys.mk' device/infinix device/transsion build/make 2>/dev/null || true

        echo "=== Available GSI files ==="
        find build/make/target/product -maxdepth 2 \
          \( -iname '*gsi*keys*.mk' -o -iname '*gsi*.mk' \) \
          -print 2>/dev/null || true

        echo "=== Device product configuration ==="
        cat device/infinix/Infinix-X6833B/AndroidProducts.mk 2>/dev/null || true

        echo "=== Repository remotes ==="
        git -C device/infinix/Infinix-X6833B remote -v 2>/dev/null || true
        git -C device/transsion/mt6789-common remote -v 2>/dev/null || true

        echo "=== Diagnostic completed ==="

        
      
    - name: Configure and Build TWRP
      run: |
        set -eo pipefail

        echo "=== Phone tree vendorsetup.sh ==="
        cat device/infinix/Infinix-X6833B/vendorsetup.sh

        cho "=== Common tree vendorsetup.sh ==="
        if [ -f device/transsion/mt6789-common/vendorsetup.sh ]; then
          cat device/transsion/mt6789-common/vendorsetup.sh
          else
              echo "File does not exist"
          fi

          echo "=== gflags references ==="
          grep -R -n "external/gflags" \
              device/infinix/Infinix-X6833B \
              device/transsion/mt6789-common 2>/dev/null || true

          echo "=== Loading build environment ==="
          source build/envsetup.sh
          lunch twrp_X6833B-eng

          # Остальные команды сборки оставь здесь без изменений

   
                
    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: twrp-build-log
        path: build.log
        if-no-files-found: ignore


    - name: Set Build Date # Output will be use in Release
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Include Recovery Installer
      run: |
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
          wget https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
          zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true
        
    - name: Recovery to tar for Samsung devices
      run: |
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
          tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true
      
 
    - name: Find vendor_boot.img
      id: find_vendor_boot
      shell: bash
      run: |
        set -euo pipefail

        IMAGE="$(find "$GITHUB_WORKSPACE/workspace/out/target/product" \
          -type f \
          -name vendor_boot.img \
          -size +1M \
          -print -quit)"

        if [ -z "$IMAGE" ]; then
          echo "ERROR: Built vendor_boot.img not found"
          exit 1
        fi

        echo "Built image: $IMAGE"
        sha256sum "$IMAGE"
        echo "image_path=$IMAGE" >> "$GITHUB_OUTPUT"

       
    - name: Create GitHub Release and Upload vendor_boot.img
      uses: softprops/action-gh-release@v2
      with:
          tag_name: TWRP-${{ github.run_id }}
          name: "Unofficial TWRP - Infinix Note 30 X6833B"
          body: |
            Unofficial TWRP Recovery for Infinix Note 30 (X6833B).

            - Android: 16
            - Build: GitHub Actions
            - Image: vendor_boot.img

            Проверь совместимость образа перед прошивкой.
          draft: false
          prerelease: false
          files: ${{ steps.find_vendor_boot.outputs.image_path }}
          fail_on_unmatched_files: true
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    
    - name: Print Release URL
      shell: bash
      run: |
        echo "GitHub Release:"
        echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/TWRP-${GITHUB_RUN_ID}"


    - name: Upload vendor_boot.img to MEGA
      shell: bash
      env:
        MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
        MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
      run: |
        set -euo pipefail

        IMAGE_PATH="$GITHUB_WORKSPACE/workspace/out/target/product/X6833B/vendor_boot.img"

        if [ ! -f "$IMAGE_PATH" ]; then
          IMAGE_PATH="$(find "$GITHUB_WORKSPACE" -type f -name vendor_boot.img \
            -path '*/out/target/product/*' -print -quit)"
        fi

        if [ -z "${IMAGE_PATH:-}" ] || [ ! -f "$IMAGE_PATH" ]; then
          echo "::error::Built vendor_boot.img not found"
          exit 1
        fi

        if [ -z "$MEGA_EMAIL" ] || [ -z "$MEGA_PASSWORD" ]; then
          echo "::error::MEGA credentials are missing"
          exit 1
        fi

        sudo apt-get update
        sudo apt-get install -y megacmd

        mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"
        mega-mkdir -p /TWRP-Backups
        mega-put "$IMAGE_PATH" /TWRP-Backups/
        mega-logout

        echo "vendor_boot.img uploaded to MEGA"
 
