name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
       MANIFEST_BRANCH:
        description: TWRP branch
        required: true
        type: choice
        default: twrp-14.1
        options:
          - twrp-14.1
       DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/Sulustan007/twrp-device_infinix_Infinix-X6833B'
       DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'fox_12.1-a14'
       DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/infinix/Infinix-X6833B'
       DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'X6833B'
       BUILD_TARGET:
        description: Build target
        required: true
        type: choice
        default: vendorboot
        options:
            - vendorboot
       LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
       RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
       RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true
jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v3
   
    
    
    - name: Download Stock Vendor Boot
      shell: bash
      run: |
        set -euo pipefail

        URL="https://cold-na-phx-3.gofile.io/download/web/94ad1c77-e53d-417c-932e-3592a4315824/vendor_boot.img"

        echo "Downloading stock vendor_boot.img..."

        curl -fLsS --retry 3 --retry-delay 3 \
          --connect-timeout 20 \
          -A "Mozilla/5.0" \
          -o vendor_boot.img "$URL"

        echo "Checking downloaded file..."

        SIZE=$(stat -c %s vendor_boot.img)
        echo "Downloaded size: $SIZE bytes"

        file vendor_boot.img

        if [ "$SIZE" -lt 1048576 ]; then
          echo "::error::Downloaded file is too small or may be an HTML page."
          head -c 300 vendor_boot.img || true
          echo
          exit 1
        fi

        if head -c 500 vendor_boot.img | grep -Eqi '<!DOCTYPE html|<html'; then
          echo "::error::GoFile returned an HTML page instead of vendor_boot.img."
          exit 1
        fi

        echo "SHA256:"
        sha256sum vendor_boot.img

        echo "Downloaded file:"
        ls -lh vendor_boot.img

        echo "Stock vendor_boot.img downloaded successfully."


    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "::endgroup::"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
        
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 11

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1'  || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Initialize Repo
      shell: bash
      run: |
        set -e
        mkdir -p "$GITHUB_WORKSPACE/workspace"
        cd "$GITHUB_WORKSPACE/workspace"

        git config --global user.name "Samuel Kendall"
        git config --global user.email "kinguser981@gmail.com"

        repo init --depth=1 \
          -u "${{ steps.manifest.outputs.value }}" \
          -b "${{ github.event.inputs.MANIFEST_BRANCH }}"
          
    - name: Repo Sync
      shell: bash
      run: |
        set -e
        cd "$GITHUB_WORKSPACE/workspace"
        repo sync -c --no-clone-bundle --no-tags -j2 --force-sync

    - name: Clone Device Tree
      shell: bash
      run: |
        set -e
        cd "$GITHUB_WORKSPACE/workspace"

        git clone \
          --depth=1 \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          "${{ github.event.inputs.DEVICE_TREE }}" \
          "${{ github.event.inputs.DEVICE_PATH }}"

        cd "${{ github.event.inputs.DEVICE_PATH }}"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        


    - name: Check Build Makefile
      shell: bash
      run: |
        set -euo pipefail
        cd workspace

        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"
        DEVICE_NAME="${{ github.event.inputs.DEVICE_NAME }}"

        echo "Checking device path: $DEVICE_PATH"
        ls -la "$DEVICE_PATH"

        if [ -f "$DEVICE_PATH/twrp_${DEVICE_NAME}.mk" ]; then
          echo "DEVICE_MAKEFILE=twrp_${DEVICE_NAME}" >> "$GITHUB_ENV"
        elif [ -f "$DEVICE_PATH/omni_${DEVICE_NAME}.mk" ]; then
          echo "DEVICE_MAKEFILE=omni_${DEVICE_NAME}" >> "$GITHUB_ENV"
        else
          echo "::error::Could not find a matching device makefile"
          echo "Available makefiles:"
          find "$DEVICE_PATH" -maxdepth 1 -type f -name "*.mk"
          exit 1
        fi

    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1' && github.event.inputs.MANIFEST_BRANCH != 'twrp-14.1'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    
    - name: Building Image
      shell: bash
      run: |
        set -e
        cd "$GITHUB_WORKSPACE/workspace"

        source build/envsetup.sh

        export ALLOW_MISSING_DEPENDENCIES=true

        lunch twrp_X6833B-eng

        mka adbd vendorbootimage -j2

    - name: Set Build Date # Output will be use in Release
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Include Recovery Installer
      run: |
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
          wget https://github.com/kinguser981/recovery-installer/releases/download/zip/recovery-installer.zip
          zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true
        
    - name: Recovery to tar for Samsung devices
      run: |
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
          tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true
      
 
    - name: Find vendor_boot.img
      id: find_vendor_boot
      shell: bash
      run: |
        set -euo pipefail

        IMAGE="$(find "$GITHUB_WORKSPACE/workspace/out/target/product" \
          -type f \
          -name vendor_boot.img \
          -size +1M \
          -print -quit)"

        if [ -z "$IMAGE" ]; then
          echo "ERROR: Built vendor_boot.img not found"
          exit 1
        fi

        echo "Built image: $IMAGE"
        sha256sum "$IMAGE"
        echo "image_path=$IMAGE" >> "$GITHUB_OUTPUT"

       
    - name: Create GitHub Release and Upload vendor_boot.img
      uses: softprops/action-gh-release@v2
      with:
          tag_name: TWRP-${{ github.run_id }}
          name: "Unofficial TWRP - Infinix Note 30 X6833B"
          body: |
            Unofficial TWRP Recovery for Infinix Note 30 (X6833B).

            - Android: 16
            - Build: GitHub Actions
            - Image: vendor_boot.img

            Проверь совместимость образа перед прошивкой.
          draft: false
          prerelease: false
          files: ${{ steps.find_vendor_boot.outputs.image_path }}
          fail_on_unmatched_files: true
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    
    - name: Print Release URL
      shell: bash
      run: |
        echo "GitHub Release:"
        echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/TWRP-${GITHUB_RUN_ID}"


    - name: Upload vendor_boot.img to GoFile
      shell: bash
      env:
        GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        FILE: ${{ steps.find_vendor_boot.outputs.image_path }}
      run: |
        set -euo pipefail

        if [ -z "${FILE:-}" ] || [ ! -f "$FILE" ]; then
          echo "::error::vendor_boot.img not found: ${FILE:-empty path}"
          exit 1
        fi

        echo "Uploading: $FILE"
        ls -lh "$FILE"

        if [ -n "${GOFILE_TOKEN:-}" ]; then
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --retry 2 \
            -H "Authorization: Bearer ${GOFILE_TOKEN}" \
            -F "file=@${FILE}" \
            https://upload.gofile.io/uploadfile)
        else
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --retry 2 \
            -F "file=@${FILE}" \
            https://upload.gofile.io/uploadfile)
        fi

        echo "$RESPONSE" > gofile-response.json

        python3 - <<'PY'
        import json
        import sys

        with open("gofile-response.json", encoding="utf-8") as f:
            response = json.load(f)

        if response.get("status") != "ok":
            print("GoFile upload failed:", response)
            sys.exit(1)

        data = response.get("data", {})
        link = data.get("downloadPage") or data.get("downloadPageUrl")

        if not link:
            print("Upload response has no download link:", response)
            sys.exit(1)

        print("GoFile download page:", link)

        with open("gofile-link.txt", "w", encoding="utf-8") as f:
            f.write(link)
        PY

        echo "## GoFile Upload" >> "$GITHUB_STEP_SUMMARY"
        echo "Download link: $(cat gofile-link.txt)" >> "$GITHUB_STEP_SUMMARY"

    - name: Show GoFile link
      if: success()
      shell: bash
      run: |
        if [ ! -f gofile-link.txt ]; then
          echo "::error::GoFile link file not found"
          exit 1
        fi

        LINK="$(cat gofile-link.txt)"

        echo "GoFile download link: $LINK"

        {
          echo "## GoFile Download"
          echo ""
          echo "[$LINK]($LINK)"
        } >> "$GITHUB_STEP_SUMMARY"
